name: commonplace
description: "Commonplace: turn the reels you save into notes you actually reread."
publish_to: 'none'
version: 1.1.0+3

environment:
  sdk: ^3.13.7

dependencies:
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.3
  google_sign_in: ^7.2.0
  http: ^1.6.0
  image_picker: ^1.2.4
  in_app_purchase: ^3.3.1
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  receive_sharing_intent: ^1.9.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  fonts:
    - family: Recursive
      fonts:
        - asset: assets/fonts/Recursive-Variable.ttf
